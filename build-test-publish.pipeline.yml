name: 1.15$(Rev:.r)

trigger:
  - master

pr:
  - master

variables:
  packageFolder: _package
  vsixFolder: '$(Build.ArtifactStagingDirectory)/vsix'
  vsixFile: '$(vsixFolder)/matlab-$(Build.BuildNumber).vsix'

stages:
  - stage: build
    displayName: Build and publish dev
    pool:
      vmImage: ubuntu-latest
    jobs:
      - job: build_test_package
        displayName: Build, test, and package
        steps:
          - task: UseNode@1
            displayName: Install node.js
            inputs:
              version: 20.x

          - script: npm install
            displayName: Install dependencies

          - script: npm run build
            displayName: Build

          - script: npm run test
            displayName: Test

          - script: npm run preparePackage
            displayName: Prepare package

          - task: TfxInstaller@5
            displayName: Install tfx-cli
            inputs:
              version: v0.23.x

          - task: PackageAzureDevOpsExtension@5
            displayName: Package
            inputs:
              rootFolder: '$(packageFolder)'
              outputPath: '$(vsixFile)'
              extensionVersion: '$(Build.BuildNumber)'
              updateTasksVersion: true
              updateTasksVersionType: minor

          - publish: '$(vsixFile)'
            displayName: Store extension
            artifact: extension

          - task: PublishAzureDevOpsExtension@5
            displayName: Publish dev
            inputs:
              connectTo: VsTeam
              connectedServiceName: MathWorks
              fileType: vsix
              vsixFile: '$(vsixFile)'
              extensionTag: -dev
              extensionVisibility: private
              updateTasksVersion: false
              shareWith: iat-ci-dev
              noWaitValidation: true

  - stage: integration_test
    displayName: Integration test
    dependsOn: build
    pool:
      vmImage: ubuntu-latest
    jobs:
      - job: wait_for_extension
        displayName: Wait for extension to propagate
        steps:
          - task: TfxInstaller@5
            displayName: Install tfx-cli
            inputs:
              version: v0.23.x
          - task: IsAzureDevOpsExtensionValid@5
            displayName: Validate dev extension
            inputs:
              connectTo: VsTeam
              connectedServiceName: MathWorks
              method: id
              publisherId: MathWorks
              extensionId: matlab-azure-devops-extension
              extensionTag: -dev
      - template: integ-test-promote-template.yml
        parameters:
          TASK_VERSION: ['0', '1']

  - stage: publish_prerelease
    displayName: Publish prerelease
    dependsOn: integration_test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    pool:
      vmImage: ubuntu-latest
    jobs:
      - deployment: publish_prerelease
        environment: prerelease
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - download: current
                  displayName: Get stored extension
                  artifact: extension

                - task: TfxInstaller@5
                  displayName: Install tfx-cli
                  inputs:
                    version: v0.23.x

                - task: PublishAzureDevOpsExtension@5
                  displayName: Publish prerelease
                  inputs:
                    connectTo: VsTeam
                    connectedServiceName: MathWorks
                    fileType: vsix
                    extensionTag: -prerelease
                    extensionVisibility: private
                    vsixFile: $(Pipeline.Workspace)/extension/*.vsix
                    updateTasksVersion: false

  - stage: publish_release
    displayName: Publish release
    dependsOn: publish_prerelease
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    pool:
      vmImage: ubuntu-latest
    jobs:
      - deployment: publish_release
        environment: release
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - download: current
                  displayName: Get stored extension
                  artifact: extension

                - task: TfxInstaller@5
                  displayName: Install tfx-cli
                  inputs:
                    version: v0.23.x

                - task: PublishAzureDevOpsExtension@5
                  displayName: Publish release
                  inputs:
                    connectTo: VsTeam
                    connectedServiceName: MathWorks
                    fileType: vsix
                    vsixFile: $(Pipeline.Workspace)/extension/*.vsix
                    updateTasksVersion: false

